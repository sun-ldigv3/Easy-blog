<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Easy-blog</title>
  <style>
    /* 精简样式，来自原项目 */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; background: #fff; color: #333; }
    .main-container { display: flex; min-height: 100vh; }
    .sidebar { width: 250px; background: #f8fafc; border-right: 1px solid #e2e8f0; position: fixed; height: 100vh; overflow-y: auto; z-index: 100; }
    .sidebar-header { padding: 20px; border-bottom: 1px solid #e2e8f0; background: white; }
    .sidebar-header h2 { font-size: 1.3rem; color: #1f2937; margin-bottom: 15px; }
    .navigation-list { padding: 15px; }
    .nav-item { display: block; padding: 14px; margin-bottom: 10px; border-radius: 8px; color: #4b5563; text-decoration: none; transition: all 0.3s ease; cursor: pointer; border: 1px solid transparent; }
    .nav-item:hover { background: #edf2f7; color: #2563eb; border-color: #e2e8f0; transform: translateY(-1px); }
    .nav-title { font-weight: 600; font-size: 1rem; margin-bottom: 6px; }
    .nav-preview { font-size: 0.85rem; color: #6b7280; line-height: 1.3; margin-bottom: 6px; }
    .nav-date { font-size: 0.75rem; color: #9ca3af; }
    .nav-empty { text-align: center; padding: 30px 15px; color: #9ca3af; }
    .search-container { position: fixed; top: 25px; right: 40px; z-index: 1000; }
    .search-input { width: 45px; height: 45px; padding: 12px 16px; border: 1px solid #d1d5db; border-radius: 22.5px; font-size: 0.95rem; transition: all 0.4s; background: white; }
    .search-input:focus { width: 280px; outline: none; border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }
    .content-area { flex: 1; margin-left: 250px; padding: 35px; }
    header { margin-bottom: 35px; padding-bottom: 20px; border-bottom: 1px solid #f1f5f9; }
    h1 { font-size: 2.3rem; color: #1f2937; margin-bottom: 8px; }
    .subtitle { font-size: 1.05rem; color: #6b7280; }
    .data-grid-vertical { display: flex; flex-direction: column; gap: 22px; }
    .data-card { width: 100%; min-height: 210px; border: 1px solid #e2e8f0; border-radius: 12px; padding: 28px; background: white; }
    .data-id { font-weight: 700; color: #2563eb; margin-bottom: 16px; padding-bottom: 14px; border-bottom: 2px solid #f3f4f6; font-size: 1.25rem; }
    .data-content { color: #374151; line-height: 1.65; white-space: pre-line; margin-bottom: 18px; font-size: 1.05rem; }
    .data-meta { font-size: 0.9rem; color: #6b7280; text-align: right; font-weight: 500; }
  </style>
</head>
<body>
  <div class="main-container">
    <div class="sidebar">
      <div class="sidebar-header"><h2>导航</h2></div>
      <div id="navigation" class="navigation-list"></div>
    </div>
    <div class="search-container"><input type="text" id="navSearch" placeholder="   🔍︎" class="search-input"></div>
    <div class="content-area">
      <header>
        <h1>Easy-blog</h1>
        <p class="subtitle">共 <span id="totalCount">0</span> 条笔记</p>
      </header>
      <div id="alert" class="alert" style="display:none;"></div>
      <div id="loading" class="loading">正在加载...</div>
      <div id="empty" class="empty-state" style="display:none;"><p>KV存储中未找到数据</p><button onclick="window.location.reload()">刷新页面</button></div>
      <div id="dataGrid" class="data-grid-vertical"></div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function() { loadAllKVData(); setupSearchFilter(); });
    async function loadAllKVData() {
      const alertEl = document.getElementById('alert');
      const loadingEl = document.getElementById('loading');
      const emptyEl = document.getElementById('empty');
      const dataGridEl = document.getElementById('dataGrid');
      try {
        const response = await fetch('/api/notes');
        const data = await response.json();
        loadingEl.style.display = 'none';
        if (data.length === 0) { emptyEl.style.display = 'block'; return; }
        generateNavigation(data); renderVerticalCards(data); setTimeout(animateCardEntrance,100);
        document.getElementById('totalCount').textContent = data.length;
      } catch (err) {
        loadingEl.style.display = 'none'; alertEl.style.display = 'block'; alertEl.className = 'alert alert-error'; alertEl.innerHTML = `<strong>错误:</strong> ${err.message}`;
      }
    }
    function generateNavigation(data) {
      const navContainer = document.getElementById('navigation'); if (data.length === 0) { navContainer.innerHTML = '<div class="nav-empty">暂无数据</div>'; return; }
      const navHTML = data.map(item => `<div class="nav-item" onclick="scrollToCard('${item.id}')"><div class="nav-title">${escapeHtml(item.id)}</div><div class="nav-preview">${escapeHtml(item.content.substring(0,45))}${item.content.length>45?'...':''}</div><div class="nav-date">${new Date(item.modified).toLocaleDateString()}</div></div>`).join('');
      navContainer.innerHTML = navHTML;
    }
    function renderVerticalCards(data) { const dataGridEl = document.getElementById('dataGrid'); dataGridEl.innerHTML = ''; data.sort((a,b)=>new Date(b.modified)-new Date(a.modified)); data.forEach(item=>{ const card=document.createElement('div'); card.className='data-card'; card.setAttribute('data-id',item.id); const safeId=escapeHtml(item.id); const safeContent=escapeHtml(item.content); const formattedDate=new Date(item.modified).toLocaleString(); card.innerHTML=`<div class="data-id">${safeId}</div><div class="data-content">${safeContent.replace(/\n/g,'<br>')}</div><div class="data-meta">更新时间: ${formattedDate}</div>`; dataGridEl.appendChild(card); }); }
    function scrollToCard(cardId){ const element=document.querySelector(`[data-id="${cardId}"]`); if(element){ element.scrollIntoView({behavior:'smooth', block:'start'}); element.style.animation='highlightPulse 1.8s ease'; }}
    function animateCardEntrance(){ const cards=document.querySelectorAll('.data-card'); cards.forEach((card,index)=>{ card.style.opacity='0'; card.style.transform='translateY(20px)'; setTimeout(()=>{ card.style.transition='all 0.7s cubic-bezier(0.4,0,0.2,1)'; card.style.opacity='1'; card.style.transform='translateY(0)'; }, index*100); }); }
    function setupSearchFilter(){ const searchInput=document.getElementById('navSearch'); searchInput.addEventListener('input', function(e){ const searchTerm=e.target.value.toLowerCase(); const navItems=document.querySelectorAll('.nav-item'); navItems.forEach(item=>{ const text=item.textContent.toLowerCase(); item.style.display = text.includes(searchTerm) ? 'block' : 'none'; }); }); }
    function escapeHtml(unsafe){ if(!unsafe) return ''; return unsafe.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;'); }
  </script>
</body>
</html>
